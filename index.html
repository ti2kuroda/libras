<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradutor Libras</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
</head>
<body>

    <div class="container">
        <h1>Tradutor de Voz para Libras 🤟</h1>
        <p>Clique em Falar, diga a frase, e depois clique em Enviar.</p>

        <div id="texto-reconhecido" class="caixa-texto">
            O texto reconhecido aparecerá aqui...
        </div>

        <div class="botoes">
            <button id="btn-microfone" class="btn-mic">🎤 Falar</button>
            <button id="btn-enviar" class="btn-enviar" disabled>Enviar ▶️</button>
        </div>

        <div id="status" class="status">Aguardando</div>
    </div>

    <!-- Div do VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
